<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Connexion — Cashpay Admin</title>
    <link
      rel="stylesheet"
      href="/assets/vendors/mdi/css/materialdesignicons.min.css"
    />
    <link rel="stylesheet" href="/assets/vendors/css/vendor.bundle.base.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="icon" href="/assets/images/favicon.png" />
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="row w-100">
          <div
            class="content-wrapper full-page-wrapper d-flex align-items-center auth login-bg"
          >
            <div class="card col-lg-4 mx-auto">
              <div class="card-body px-5 py-5">
                <h1 class="card-title text-start mb-3">Cashpay Admin</h1>
                <p class="text-muted">
                  Connectez-vous avec votre compte Cashpay ayant le rôle Admin.
                  Cet espace est séparé de l’application client.
                </p>
                <form id="login-form">
                  <div class="form-group">
                    <label for="email">Adresse e-mail</label
                    ><input
                      id="email"
                      name="email"
                      type="email"
                      autocomplete="username"
                      required
                      maxlength="254"
                      class="form-control p_input"
                    />
                  </div>
                  <div class="form-group">
                    <label for="password">Mot de passe</label
                    ><input
                      id="password"
                      name="password"
                      type="password"
                      autocomplete="current-password"
                      required
                      maxlength="256"
                      class="form-control p_input"
                    />
                  </div>
                  <div class="form-group">
                    <label for="otp"
                      >Code de sécurité, si configuré sur votre compte</label
                    ><input
                      id="otp"
                      name="otp"
                      inputmode="numeric"
                      autocomplete="one-time-code"
                      pattern="[0-9]{6}"
                      maxlength="6"
                      class="form-control p_input"
                    />
                  </div>
                  <p id="login-error" class="text-danger" role="alert"></p>
                  <div class="text-center d-grid gap-2">
                    <button
                      id="login-submit"
                      type="submit"
                      class="btn btn-primary btn-block enter-btn"
                    >
                      Se connecter
                    </button>
                  </div>
                </form>
                <p class="text-muted mt-4">
                  Aucun compte administrateur ni mot de passe de démonstration
                  n’est créé.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/login.js" defer></script>
  </body>
</html>
